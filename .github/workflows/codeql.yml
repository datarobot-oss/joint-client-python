name: CodeQL

on:
    pull_request:
    push:
        branches: [main]
    # New queries ship with CodeQL releases, so main is also re-scanned weekly.
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    analyze:
        name: CodeQL (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            # Reading workflow run metadata is required on non-public repos.
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                # `actions` scans the workflow files themselves.
                language: [actions, python]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Neither language needs a build, so CodeQL reads the source directly.
            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  queries: security-extended

            - name: Analyze
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  category: /language:${{ matrix.language }}

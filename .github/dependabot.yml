version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Bundle every version bump for this ecosystem into one PR.
      groups:
          github-actions:
              patterns:
                  - "*"
      open-pull-requests-limit: 5
      labels:
          - dependencies

    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      # Must be at least the uv exclude-newer window in pyproject.toml, or
      # Dependabot targets releases that uv refuses to lock.
      cooldown:
          default-days: 14
      # Bundle every version bump for this ecosystem into one PR.
      groups:
          uv:
              patterns:
                  - "*"
      open-pull-requests-limit: 5
      labels:
          - dependencies
